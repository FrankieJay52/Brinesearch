[build]
  command = "npm run build:netlify"
  publish = "dist-production"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/"
  to = "/v18/"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/v18/"
  status = 302
  force = true

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/v18/manifest.webmanifest"
  status = 302
  force = true

[[redirects]]
  from = "/v17/*"
  to = "/v18/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://wvxzqtoiwhrgovzddtvz.supabase.co wss://wvxzqtoiwhrgovzddtvz.supabase.co https://api.open-meteo.com https://api.bigdatacloud.net https://challenges.cloudflare.com https://tiles.openfreemap.org https://tile.openstreetmap.org https://maps.googleapis.com https://maps.gstatic.com https://routes.googleapis.com; img-src 'self' data: blob: https://wvxzqtoiwhrgovzddtvz.supabase.co https://tiles.openfreemap.org https://tile.openstreetmap.org https://maps.googleapis.com https://maps.gstatic.com https://*.ggpht.com https://*.googleusercontent.com; font-src 'self' data: https://tiles.openfreemap.org https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/v18/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/v18/"

[[headers]]
  for = "/v18/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/v18/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/v18/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/v18/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/v18/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/v18/maplibre/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
