  <link rel="stylesheet" href="/src/styles/46-owner-approved-routes-map-issue108.css">

</head>
<body>
  <main id="ownerMapFixture"></main>
  <script>
    window.__ownerMapFixtureOwner=new URLSearchParams(location.search).get("owner")!=="false";
    window.__ownerMapFixtureMode="success";
    window.__ownerMapFixtureCalls=[];
    window.editorIsOwner=()=>window.__ownerMapFixtureOwner;
    const line=(west,south,east,north)=>({type:"LineString",coordinates:[[west,south],[(west+east)/2,(south+north)/2],[east,north]]});
    const fixtureFeatures=[
      {type:"Feature",geometry:line(-80.98,39.96,-80.47,40.2),properties:{identity_id:"policy-1",display_name:"I-70",canonical_name:"Interstate 70",route_system:"1",route_number:"70",route_designation:"1 70",road_class:"interstate",state_code:"OH",county_code:"BEL",county_name:"Belmont County",approval_status:"approved_by_policy",source_current:true,source_identity_key:"OH:ODOT:NLF:I70-BEL",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture"}},
      {type:"Feature",geometry:line(-80.8,40.03,-80.55,40.12),properties:{identity_id:"explicit-1",display_name:"Great Bend Rd",route_system:null,route_number:"338",route_designation:"CR 338",road_class:"county",state_code:"OH",county_code:"MEG",county_name:"Meigs County",approval_status:"explicitly_approved",source_current:true,source_identity_key:"OH:ODOT:NLF:CR338-MEG",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture"}},
      {type:"Feature",geometry:line(-80.9,40.16,-80.62,40.0),properties:{identity_id:"candidate-1",display_name:"Market St",route_designation:"TR 78",road_class:"township",state_code:"OH",county_code:"STA",county_name:"Stark County",township:"Plain Township",approval_status:"candidate",source_current:true,source_identity_key:"OH:ODOT:NLF:TR78-STA",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture"}},
      {type:"Feature",geometry:line(-80.93,40.09,-80.5,40.08),properties:{identity_id:"held-1",display_name:"Market St",route_designation:"TR 78",road_class:"township",state_code:"OH",county_code:"BEL",county_name:"Belmont County",township:"Richland Township",approval_status:"held",source_current:false,mapping_conflict:true,source_identity_key:"OH:ODOT:NLF:TR78-BEL",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture"}},
      {type:"Feature",geometry:line(-80.78,39.99,-80.61,40.19),properties:{identity_id:"restricted-1",display_name:"Whetstone Ct",road_class:"local",state_code:"OH",county_code:"BEL",county_name:"Belmont County",municipality:"St. Clairsville",approval_status:"restricted",source_current:true,source_identity_key:"OH:ODOT:NLF:PBELTR80322**C",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture"}},
      {type:"Feature",geometry:line(-80.88,40.19,-80.42,40.02),properties:{identity_id:"reference-1",display_name:"Reference Rd",road_class:"local",state_code:"WV",county_code:"OHI",county_name:"Ohio County",approval_status:"reference_only",source_current:true,source_identity_key:"WV:WVDOT:REF-1",source_agency:"WVDOT",source_dataset:"Roadway Inventory",source_version:"fixture"}}
    ];
    const fixtureDetail={identity_id:"policy-1",canonical_road_id:"road-1",display_name:"I-70",canonical_name:"Interstate 70",source_identity_key:"OH:ODOT:NLF:I70-BEL",aliases:["Interstate 70","I 70"],route_system:"1",route_number:"70",route_designation:"1 70",road_class:"interstate",state_code:"OH",county_code:"BEL",county_name:"Belmont County",source_agency:"ODOT",source_dataset:"TIMS",source_version:"fixture",source_record_ids:["I70-BEL"],source_current:true,approval_status:"approved_by_policy",approval_basis:"Exact current structured Interstate identity is approved by policy.",public_access_status:"public",drivable_status:"drivable",truck_status:"not_applicable",restriction_summary:null,hold_summary:null,geometry_status:"exact current authoritative geometry",geometry_segment_count:7,bounds:{west:-80.98,south:39.96,east:-80.47,north:40.2},pads:[{pad_id:"pad-1",pad_name:"Alpha Pad",company:"Fixture Energy",occurrence_count:2}],known_physical_junctions:3,junctions_truncated:false,junctions:[{junction_id:"j-1",display_id:"BEL-J1",lat:40.0712345,lng:-80.7012345,connected_roads:[{identity_id:"candidate-1",display_name:"Market St",road_name_at_junction:"Market St",route_designation:"TR 78",road_class:"township",state_code:"OH",county_code:"STA",county_name:"Stark County",township:"Plain Township",source_identity_key:"OH:ODOT:NLF:TR78-STA"}]},{junction_id:"j-2",display_id:"BEL-J2",lat:40.09,lng:-80.66,connected_roads:[]}],graph_summary:"build fixture · algorithm fixture · activated today",verification_date:"2026-08-16T12:00:00Z"};
    window.editorRequest=async(path,options={})=>{
      const body=JSON.parse(options.body||"{}");window.__ownerMapFixtureCalls.push({path,body});
      await new Promise((resolve,reject)=>{const timer=setTimeout(resolve,20);options.signal?.addEventListener("abort",()=>{clearTimeout(timer);reject(new DOMException("Aborted","AbortError"));},{once:true});});
      if(path.endsWith("owner_approved_routes_map_pad_options"))return[{pad_id:"pad-1",pad_name:"Alpha Pad",company:"Fixture Energy",state:"OH",lat:40.075,lng:-80.69}];
      if(path.endsWith("owner_approved_routes_map_road_detail"))return{...fixtureDetail,identity_id:body.p_identity_id,display_name:fixtureFeatures.find(feature=>feature.properties.identity_id===body.p_identity_id)?.properties.display_name||fixtureDetail.display_name};
      if(path.endsWith("owner_approved_routes_map_viewport")){
        if(window.__ownerMapFixtureMode==="error"||body.p_search==="__error__")throw new Error("Fixture database error");
        if(window.__ownerMapFixtureMode==="empty"||body.p_search==="__empty__")return{type:"FeatureCollection",features:[],pads:[],truncated:false,limit:body.p_limit,zoom:body.p_zoom};
        if(body.p_search==="__large__"){
          const count=Math.min(Number(body.p_limit)||800,800),features=Array.from({length:count},(_,index)=>({type:"Feature",geometry:line(-80.98+(index%40)*.001,39.96+(index%30)*.001,-80.47-(index%35)*.001,40.2-(index%25)*.001),properties:{...fixtureFeatures[index%fixtureFeatures.length].properties,identity_id:`large-${index}`,display_name:`Viewport road ${index+1}`,source_identity_key:`FIXTURE:LARGE:${index+1}`}}));
          return{type:"FeatureCollection",features,pads:[],truncated:true,limit:body.p_limit,zoom:body.p_zoom};
        }
        let features=fixtureFeatures.filter(feature=>(body.p_statuses||[]).includes(feature.properties.approval_status)&&(body.p_road_classes||[]).includes(feature.properties.road_class));
        if(body.p_route_systems?.length)features=features.filter(feature=>body.p_route_systems.includes(feature.properties.route_system));
        if(body.p_search){const query=String(body.p_search).toLowerCase();features=features.filter(feature=>JSON.stringify(feature.properties).toLowerCase().includes(query));}
        return{type:"FeatureCollection",features,pads:body.p_pad_id?[{pad_id:"pad-1",pad_name:"Alpha Pad",company:"Fixture Energy",lat:40.075,lng:-80.69}]:[],truncated:false,limit:body.p_limit,zoom:body.p_zoom};
      }
      throw new Error(`Unexpected fixture RPC: ${path}`);
    };
  </script>

  <script>
    const fixtureRoot=document.getElementById("ownerMapFixture");
    window.__ownerMapFixtureMount=window.BrineSearchApprovedRoutesMap.mount(fixtureRoot).catch(error=>{fixtureRoot.dataset.mountError=error.message;fixtureRoot.textContent=`Mount denied: ${error.message}`;});
