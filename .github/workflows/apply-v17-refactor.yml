name: Build BrineSearch V17 refactor

on:
  push:
    branches: [v17-refactor]
    paths:
      - '.github/v17-refactor/create_v17.py'
      - '.github/workflows/apply-v17-refactor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/v17-refactor/create_v17.py'
      - '.github/workflows/apply-v17-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v17-refactor
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Adapt the generator to the current source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/v17-refactor/create_v17.py')
          s = p.read_text()

          old_scripts = "script_matches = list(re.finditer(r'<script(?:\\s+id=\"([^\"]+)\")?[^>]*>([\\s\\S]*?)</script>', html, re.I))\nif len(script_matches) != 5:\n    raise SystemExit(f'Expected 5 inline scripts, found {len(script_matches)}')\n\ntheme, main_js, weather, scroll_guard, field_runtime = [match.group(2) for match in script_matches]"
          new_scripts = "all_script_matches = list(re.finditer(r'<script([^>]*)>([\\s\\S]*?)</script>', html, re.I))\nscript_matches = [match for match in all_script_matches if not re.search(r'\\bsrc\\s*=', match.group(1), re.I)]\nif len(script_matches) != 5:\n    raise SystemExit(f'Expected 5 inline scripts, found {len(script_matches)}')\n\ntheme, main_js, weather, scroll_guard, field_runtime = [match.group(2) for match in script_matches]"
          if old_scripts in s:
              s = s.replace(old_scripts, new_scripts)

          s = s.replace(
              'import re, json, hashlib, shutil, collections',
              'import re, json, hashlib, shutil, collections, subprocess'
          )

          old_splits = 'splits = [0,343,709,1053,1390,1768,2101,2440,2800,3149,3473,3838,4200,4553,4855,5255,5595,5971,6289,6530]'
          dynamic_splits = r'''split_targets = [343,709,1053,1390,1768,2101,2440,2800,3149,3473,3838,4200,4553,4855,5255,5595,5971,6289]
          node_splitter = r"""
          const fs = require('fs');
          const vm = require('vm');
          const payload = JSON.parse(fs.readFileSync(0, 'utf8'));
          const lines = payload.lines;
          const targets = payload.targets;
          function parsesBody(value) {
            try { new vm.Script('(async()=>{\n' + value.join('\n') + '\n})'); return true; }
            catch { return false; }
          }
          const splits = [0];
          let previous = 0;
          for (const originalTarget of targets) {
            const target = Math.min(lines.length - 60, Math.max(previous + 120, originalTarget));
            let found = null;
            for (let distance = 0; distance <= 450 && found === null; distance += 1) {
              for (const candidate of [target + distance, target - distance]) {
                if (candidate <= previous + 100 || candidate >= lines.length - 50) continue;
                if (lines[candidate - 1].trim() && lines[candidate].trim()) continue;
                if (parsesBody(lines.slice(previous, candidate)) && parsesBody(lines.slice(candidate))) {
                  found = candidate;
                  break;
                }
              }
            }
            if (found === null) throw new Error('Could not find a safe source boundary near line ' + originalTarget);
            splits.push(found);
            previous = found;
          }
          splits.push(lines.length);
          process.stdout.write(JSON.stringify(splits));
          """
          split_result = subprocess.run(
              ['node', '-e', node_splitter],
              input=json.dumps({'lines': body, 'targets': split_targets}),
              text=True,
              capture_output=True,
              check=True
          )
          splits = json.loads(split_result.stdout)'''
          if old_splits not in s:
              raise SystemExit('Split target not found')
          s = s.replace(old_splits, dynamic_splits)

          old_check = "if len(body) != splits[-1]:\n    raise SystemExit(f'Main application changed: expected {splits[-1]} body lines, found {len(body)}')\n\n"
          new_check = "if len(splits) != len(part_names) + 1:\n    raise SystemExit(f'Expected {len(part_names)} JavaScript parts, found {len(splits) - 1}')\n\n"
          if old_check not in s:
              raise SystemExit('Line-count check not found')
          s = s.replace(old_check, new_check)
          p.write_text(s)
          PY

      - name: Generate modular V17 source
        run: python .github/v17-refactor/create_v17.py

      - name: Verify source-preserving split
        run: node v17/scripts/verify.mjs

      - name: Install Vite and build production preview
        run: |
          npm install
          npm run build

      - name: Commit the completed refactor branch
        run: |
          rm -rf .github/v17-refactor
          rm -f .github/workflows/apply-v17-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create BrineSearch V17 modular refactor [skip ci]"
          git push origin v17-refactor
