name: Deploy BrineSearch V18 to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brinesearch-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      VITE_V18_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            v18/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install V18 dependencies
        run: npm ci --prefix v18 --include=dev

      - name: Verify and build BrineSearch V18
        run: npm --prefix v18 run build

      - name: Prepare V18-only GitHub Pages site
        run: npm run prepare:pages:v18

      - name: Verify deployable files
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/404.html
          test -f dist-pages/.nojekyll
          test -f dist-pages/sw.js
          test -f dist-pages/manifest.webmanifest
          test -f dist-pages/maplibre/maplibre-gl-worker.mjs
          test -f dist-pages/pages-deployment.json
          grep -q "/${{ github.event.repository.name }}/assets/" dist-pages/index.html
          grep -q '"version": "18.0.0"' dist-pages/pages-deployment.json
          test ! -e dist-pages/road-manager.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    name: Deploy live site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy BrineSearch
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result on the commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FALLBACK_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="BrineSearch V18 is live"
            TARGET_URL="${PAGE_URL:-$FALLBACK_PAGE_URL}"
          else
            STATE="failure"
            DESCRIPTION="GitHub Pages deployment needs attention"
            TARGET_URL="$RUN_URL"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="BrineSearch / GitHub Pages" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
