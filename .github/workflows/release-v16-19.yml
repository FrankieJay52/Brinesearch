name: Release BrineSearch V16.19

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/release-v16-19.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested V16.19 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v16-19.patch.b64 | gzip -d > /tmp/v16-19.patch
          git apply --check /tmp/v16-19.patch
          git apply /tmp/v16-19.patch
          grep -q "BrineSearch V 16.19" index.html
          grep -q "brinesearch-v16-19" sw.js
      - name: Commit V16.19
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v16-19.patch.b64
          rm -f .github/workflows/apply-v16-19.yml
          rm -f .github/workflows/release-v16-19.yml
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release BrineSearch V16.19"
          git push origin HEAD:main
