name: Fix issue 70 context evidence road IDs

on:
  push:
    branches:
      - data/issue-70-oh-ambiguous-context
    paths:
      - .github/workflows/issue70-context-evidence-id-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/issue-70-oh-ambiguous-context
      - name: Store neighbor IDs only when their geometry is evidence
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260811044500_issue70_oh_ambiguous_context_resolution.sql')
          text = path.read_text()
          old = """      prev.road_id as prev_road_id,
      nxt.road_id as next_road_id,
      case when pr.centerline_geojson is not null
"""
          new = """      case when pr.centerline_geojson is not null then prev.road_id end as prev_road_id,
      case when nr.centerline_geojson is not null then nxt.road_id end as next_road_id,
      case when pr.centerline_geojson is not null
"""
          if text.count(old) != 1:
              raise SystemExit('expected one context neighbor-ID staging block')
          path.write_text(text.replace(old,new))

          audit = Path('v17/scripts/audit-road-data-coverage-issue70.mjs')
          a = audit.read_text()
          anchor = "  'candidate_geometry_digest',\n  'prev_geometry_digest',\n  'next_geometry_digest',"
          replacement = "  'candidate_geometry_digest',\n  'prev_geometry_digest',\n  'next_geometry_digest',\n  'case when pr.centerline_geojson is not null then prev.road_id end as prev_road_id',\n  'case when nr.centerline_geojson is not null then nxt.road_id end as next_road_id',"
          if anchor not in a:
              raise SystemExit('audit anchor not found')
          audit.write_text(a.replace(anchor,replacement))
          PY
          git diff --check
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260811044500_issue70_oh_ambiguous_context_resolution.sql v17/scripts/audit-road-data-coverage-issue70.mjs
          git commit -m 'Fix #70 context evidence neighbor IDs'
          git push origin HEAD:data/issue-70-oh-ambiguous-context
