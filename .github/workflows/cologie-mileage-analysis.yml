name: Analyze Cologie road mileage example

on:
  push:
    branches:
      - cologie-mileage-example
    paths:
      - .github/workflows/cologie-mileage-analysis.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect official ODOT road geometry around Cologie
        run: |
          python3 - <<'PY'
          import json
          import math
          import re
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          PAD = (-80.913577, 40.25403)
          BBOX = (-81.09, 40.19, -80.84, 40.36)
          SERVICE = 'https://tims.dot.state.oh.us/ags/rest/services/Roadway_Information/Road_Inventory/FeatureServer/0/query'
          params = {
              'where': "COUNTY_CD='067'",
              'geometry': ','.join(map(str, BBOX)),
              'geometryType': 'esriGeometryEnvelope',
              'inSR': '4326',
              'spatialRel': 'esriSpatialRelIntersects',
              'outFields': 'NLF_ID,JURISDICTION_CD,COUNTY_CD,ROUTE_TYPE,ROUTE_NBR,STREET_NAME,STREET_SUFFIX_CD,CARDINALITY_CD,SEGMENT_LENGTH_NBR,CTL_BEGIN_NBR,CTL_END_NBR',
              'returnGeometry': 'true',
              'outSR': '4326',
              'f': 'geojson',
              'resultRecordCount': '200000',
          }
          url = SERVICE + '?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={'User-Agent':'BrineSearch-Cologie-Road-Audit/1.0'})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = json.load(response)
          if data.get('error'):
              raise SystemExit(data['error'])
          features = data.get('features', [])
          print(f'ODOT road features in Harrison County analysis envelope: {len(features)}')

          def label(props):
              name = (props.get('STREET_NAME') or '').strip()
              suffix = (props.get('STREET_SUFFIX_CD') or '').strip()
              route_type = (props.get('ROUTE_TYPE') or '').strip()
              route_nbr = (props.get('ROUTE_NBR') or '').strip()
              if route_type in {'US','SR','IR'} and route_nbr:
                  return f'{route_type}-{route_nbr.lstrip("0")}'
              return ' '.join(x for x in (name, suffix) if x).strip() or props.get('NLF_ID') or 'Unnamed'

          names = Counter(label(f['properties']) for f in features)
          needles = ('union', 'kenwood', 'springdale', 'lamborn', 'fox', '250', 'cadiz')
          matching_names = sorted(name for name in names if any(n in name.lower() for n in needles))
          print('\nCandidate official road names:')
          for name in matching_names:
              print(f'- {name}: {names[name]} ODOT segment records')

          selected = []
          for f in features:
              name = label(f['properties'])
              if name in matching_names:
                  row = {
                      'name': name,
                      'properties': f['properties'],
                      'geometry': f['geometry'],
                  }
                  selected.append(row)
          Path('cologie-odot-road-features.json').write_text(json.dumps({
              'source':'Ohio Department of Transportation Road Inventory',
              'query_url':url,
              'pad':{'longitude':PAD[0], 'latitude':PAD[1]},
              'matching_names':matching_names,
              'features':selected,
          }, indent=2) + '\n')

          def iter_lines(geometry):
              if not geometry: return
              if geometry.get('type') == 'LineString':
                  yield geometry['coordinates']
              elif geometry.get('type') == 'MultiLineString':
                  yield from geometry['coordinates']

          def haversine(a,b):
              lon1,lat1=a; lon2,lat2=b
              r=3958.7613
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
              h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*r*math.asin(min(1,math.sqrt(h)))

          print('\nCandidate ODOT segments:')
          for row in selected:
              props=row['properties']
              lines=list(iter_lines(row['geometry']))
              vertices=sum(len(line) for line in lines)
              endpoints=[]
              for line in lines:
                  if line:
                      endpoints.extend([line[0],line[-1]])
              nearest=min((haversine(PAD,tuple(pt)) for line in lines for pt in line), default=999)
              print(json.dumps({
                  'name':row['name'],
                  'nlf_id':props.get('NLF_ID'),
                  'route_type':props.get('ROUTE_TYPE'),
                  'route_number':props.get('ROUTE_NBR'),
                  'segment_length_miles':props.get('SEGMENT_LENGTH_NBR'),
                  'nearest_vertex_to_pad_miles':round(nearest,3),
                  'vertices':vertices,
                  'endpoints':endpoints,
              }))

          # Report candidate shared vertices/intersections. ODOT linework normally splits at road junctions.
          node_roads=defaultdict(set)
          node_points={}
          for row in selected:
              for line in iter_lines(row['geometry']):
                  for pt in line:
                      key=(round(pt[0],6),round(pt[1],6))
                      node_roads[key].add(row['name'])
                      node_points[key]=pt
          print('\nShared-node intersections among candidate roads:')
          intersections=[]
          for key,roads in node_roads.items():
              if len(roads)>1:
                  record={'longitude':key[0],'latitude':key[1],'roads':sorted(roads)}
                  intersections.append(record)
                  print(json.dumps(record))
          Path('cologie-odot-intersections.json').write_text(json.dumps(intersections,indent=2)+'\n')
          PY

      - name: Upload Cologie road geometry analysis
        uses: actions/upload-artifact@v4
        with:
          name: Cologie-mileage-analysis
          path: |
            cologie-odot-road-features.json
            cologie-odot-intersections.json
          if-no-files-found: error
          retention-days: 7
