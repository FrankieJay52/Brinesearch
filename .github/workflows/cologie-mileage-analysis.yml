name: Analyze Cologie road mileage example

on:
  push:
    branches:
      - cologie-mileage-example
    paths:
      - .github/workflows/cologie-mileage-analysis.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect official ODOT road geometry around Cologie
        run: |
          python3 - <<'PY'
          import json
          import math
          import urllib.parse
          import urllib.request
          from collections import Counter, defaultdict
          from pathlib import Path

          PAD=(-80.913577,40.25403)
          BBOX=(-81.09,40.19,-80.84,40.36)
          SERVICE='https://tims.dot.state.oh.us/ags/rest/services/Roadway_Information/Road_Inventory/FeatureServer/0/query'
          params={
            'where':'1=1',
            'geometry':','.join(map(str,BBOX)),
            'geometryType':'esriGeometryEnvelope',
            'inSR':'4326',
            'spatialRel':'esriSpatialRelIntersects',
            'outFields':'NLF_ID,JURISDICTION_CD,COUNTY_CD,ROUTE_TYPE,ROUTE_NBR,STREET_NAME,STREET_SUFFIX_CD,CARDINALITY_CD,SEGMENT_LENGTH_NBR,CTL_BEGIN_NBR,CTL_END_NBR',
            'returnGeometry':'true',
            'outSR':'4326',
            'f':'geojson',
            'resultRecordCount':'200000',
          }
          url=SERVICE+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'BrineSearch-Cologie-Road-Audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as response:
              data=json.load(response)
          if data.get('error'): raise SystemExit(data['error'])
          features=data.get('features',[])
          print('ODOT features:',len(features))

          def label(props):
              rt=(props.get('ROUTE_TYPE') or '').strip()
              rn=(props.get('ROUTE_NBR') or '').strip()
              name=(props.get('STREET_NAME') or '').strip()
              suffix=(props.get('STREET_SUFFIX_CD') or '').strip()
              if rt in {'US','SR','IR'} and rn:
                  return f'{rt}-{rn.lstrip("0")}'
              return ' '.join(x for x in (name,suffix) if x).strip() or props.get('NLF_ID') or 'Unnamed'

          names=Counter(label(f['properties']) for f in features)
          needles=('union','kenwood','springdale','lamborn','fox','250','cadiz','clearfork')
          matching=sorted(n for n in names if any(x in n.lower() for x in needles))
          print('\nCandidate road names:')
          for name in matching: print(f'- {name}: {names[name]}')

          selected=[]
          for f in features:
              name=label(f['properties'])
              if name in matching:
                  selected.append({'name':name,'properties':f['properties'],'geometry':f['geometry']})
          Path('cologie-odot-road-features.json').write_text(json.dumps({'query_url':url,'features':selected},indent=2)+'\n')

          def lines(g):
              if g.get('type')=='LineString': yield g['coordinates']
              elif g.get('type')=='MultiLineString': yield from g['coordinates']
          def hav(a,b):
              lon1,lat1=a;lon2,lat2=b;r=3958.7613
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1);dl=math.radians(lon2-lon1)
              h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*r*math.asin(min(1,math.sqrt(h)))

          print('\nSelected ODOT segment records:')
          for row in selected:
              coords=[pt for line in lines(row['geometry']) for pt in line]
              nearest=min((hav(PAD,tuple(pt)) for pt in coords),default=999)
              p=row['properties']
              print(json.dumps({'name':row['name'],'nlf':p.get('NLF_ID'),'jurisdiction':p.get('JURISDICTION_CD'),'route_type':p.get('ROUTE_TYPE'),'route_nbr':p.get('ROUTE_NBR'),'street_name':p.get('STREET_NAME'),'segment_length':p.get('SEGMENT_LENGTH_NBR'),'nearest_vertex_to_pad_mi':round(nearest,3),'start':coords[0] if coords else None,'end':coords[-1] if coords else None,'vertex_count':len(coords)}))

          # Find near-identical vertices shared by different named roads.
          node_roads=defaultdict(set)
          for row in selected:
              for line in lines(row['geometry']):
                  for pt in line:
                      node_roads[(round(pt[0],6),round(pt[1],6))].add(row['name'])
          intersections=[]
          for (lon,lat),roads in node_roads.items():
              if len(roads)>1:
                  intersections.append({'longitude':lon,'latitude':lat,'roads':sorted(roads)})
          print('\nShared-node intersections:')
          for item in intersections: print(json.dumps(item))
          Path('cologie-odot-intersections.json').write_text(json.dumps(intersections,indent=2)+'\n')
          PY

      - name: Upload Cologie road geometry analysis
        uses: actions/upload-artifact@v4
        with:
          name: Cologie-mileage-analysis
          path: |
            cologie-odot-road-features.json
            cologie-odot-intersections.json
          if-no-files-found: error
          retention-days: 7
