name: Analyze Cologie road mileage example

on:
  push:
    branches:
      - cologie-mileage-example
    paths:
      - .github/workflows/cologie-mileage-analysis.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect official ODOT road geometry around Cologie
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BBOX = (-81.09, 40.19, -80.84, 40.36)
          SERVICES = [
            'https://tims.dot.state.oh.us/ags/rest/services/Roadway_Information/Road_Inventory/FeatureServer/0/query',
            'https://services6.arcgis.com/tuxY7TQIaDhLWARO/arcgis/rest/services/Road_Inventory/FeatureServer/0/query',
          ]

          def fetch(url, params):
              request_url = url + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(request_url, headers={'User-Agent':'BrineSearch-Cologie-Road-Audit/1.0'})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return request_url, json.load(response)

          tests=[]
          for service in SERVICES:
              base={
                'where':'1=1',
                'geometry':','.join(map(str,BBOX)),
                'geometryType':'esriGeometryEnvelope',
                'inSR':'4326',
                'spatialRel':'esriSpatialRelIntersects',
                'returnCountOnly':'true',
                'f':'json',
              }
              url,payload=fetch(service,base)
              tests.append({'service':service,'test':'bbox_count','url':url,'payload':payload})
              print(service, 'bbox count:', payload)
              for county in ('067','67'):
                  url,payload=fetch(service,{'where':f"COUNTY_CD='{county}'",'returnCountOnly':'true','f':'json'})
                  tests.append({'service':service,'test':f'county_{county}_count','url':url,'payload':payload})
                  print(service, f'county {county} count:', payload)

          Path('cologie-odot-query-diagnostics.json').write_text(json.dumps(tests,indent=2)+'\n')
          PY

      - name: Upload Cologie road geometry diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: Cologie-mileage-analysis
          path: cologie-odot-query-diagnostics.json
          if-no-files-found: error
          retention-days: 7
