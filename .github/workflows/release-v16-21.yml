name: Release BrineSearch V16.21

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/release-v16-21.yml
      - .github/v16-21-road-manager.gz.b64
      - CHANGELOG_V16.21.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate Road Manager
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v16-21-road-manager.gz.b64 | gzip -d > road-manager.js
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          text = re.sub(r'\s*<script[^>]+src=["\']\./road-manager\.js[^"\']*["\'][^>]*></script>', '', text, flags=re.I)
          manager = '<script src="./road-manager.js?v=16.21"></script>'
          road_db = re.search(r'<script[^>]+src=["\']\./road-database\.js[^"\']*["\'][^>]*></script>', text, flags=re.I)
          if road_db:
              text = text[:road_db.end()] + '\n  ' + manager + text[road_db.end():]
          else:
              closing = re.search(r'</body\s*>', text, flags=re.I)
              if not closing:
                  raise SystemExit('index.html has no closing body tag')
              text = text[:closing.start()] + '\n  <script src="./road-database.js?v=16.20"></script>\n  ' + manager + '\n' + text[closing.start():]

          text = text.replace('BrineSearch V 16.20', 'BrineSearch V 16.21')
          text = text.replace('BrineSearch V16.20', 'BrineSearch V16.21')
          text = text.replace('V 16.20', 'V 16.21')
          text = re.sub(r"(APP_VERSION\s*[:=]\s*['\"])16\.20(['\"])", r"\g<1>16.21\2", text)
          text = re.sub(r"(BUILD_VERSION\s*[:=]\s*['\"])16\.20(['\"])", r"\g<1>16.21\2", text)
          index_path.write_text(text, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_VERSION = ['\"][^'\"]+['\"]", "const CACHE_VERSION = 'brinesearch-v16-21'", sw, count=1)
          if "'./road-manager.js'" not in sw and '"./road-manager.js"' not in sw:
              anchor = "'./road-database.js',"
              if anchor in sw:
                  sw = sw.replace(anchor, anchor + " './road-manager.js',", 1)
              else:
                  anchor2 = '"./road-database.js",'
                  if anchor2 in sw:
                      sw = sw.replace(anchor2, anchor2 + ' "./road-manager.js",', 1)
                  else:
                      raise SystemExit('service-worker road database anchor missing')
          sw_path.write_text(sw, encoding='utf-8')

          db_path = Path('road-database.js')
          db_text = db_path.read_text(encoding='utf-8')
          db_text = db_text.replace("appVersion: '16.20'", "appVersion: '16.21'")
          db_path.write_text(db_text, encoding='utf-8')
          PY

      - name: Validate V16.21
        shell: bash
        run: |
          set -euo pipefail
          node --check road-manager.js
          node --check road-database.js
          node --check sw.js
          node <<'NODE'
          const assert = require('assert');
          const manager = require('./road-manager.js');
          assert.equal(manager.version, '16.21');
          assert.equal(manager.__test.identity('Bean Ridge Rd'), 'bean ridge road');
          assert.equal(manager.__test.identity('Bean Ridge Road'), 'bean ridge road');
          const roads = [
            {id:'one',officialName:'Bean Ridge Rd',state:'OH',aliases:[],verification:{status:'verified'},warnings:[],restrictions:[],padIds:['pad-1'],type:'street'},
            {id:'two',officialName:'Bean Ridge Road',state:'OH',aliases:[],verification:{status:'unverified'},warnings:[],restrictions:[],padIds:['pad-2'],type:'street'},
            {id:'three',officialName:'OH-800',state:'OH',routePrefix:'OH',routeNumber:'800',aliases:[],verification:{needsFieldCheck:true},warnings:['Narrow shoulder'],restrictions:['No oversize loads'],padIds:[],type:'state-route'}
          ];
          const groups = manager.__test.duplicateGroups(roads);
          assert(groups.some(group => group.length === 2 && group.some(r => r.id === 'one') && group.some(r => r.id === 'two')));
          assert.equal(manager.__test.statusInfo(roads[0]).key, 'verified');
          assert.equal(manager.__test.statusInfo(roads[2]).key, 'needs-check');
          assert(manager.__test.roadSearchText(roads[2]).includes('narrow shoulder'));
          console.log('V16.21 Road Manager tests passed');
          NODE
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          manager = Path('road-manager.js').read_text(encoding='utf-8')
          assert index.count('src="./road-manager.js?v=16.21"') == 1
          db_pos = index.find('./road-database.js')
          manager_pos = index.find('./road-manager.js?v=16.21')
          assert db_pos >= 0 and manager_pos > db_pos
          assert 'BrineSearch V 16.21' in index
          assert "brinesearch-v16-21" in sw
          assert './road-manager.js' in sw
          assert 'Road Manager and road picker' in manager
          assert 'Choose from Road Database' in manager
          assert 'Merge Duplicate Roads' in manager
          print('V16.21 static integration checks passed')
          PY
          git diff --check

      - name: Commit V16.21
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-v16-21.yml
          rm -f .github/v16-21-road-manager.gz.b64
          rm -f .github/workflows/audit-v16-20.yml
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release BrineSearch V16.21"
          git push origin HEAD:main
