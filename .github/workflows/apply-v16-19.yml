name: Apply BrineSearch V16.19

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-v16-19.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V16.19 update
        shell: bash
        run: |
          python - <<'PY2'
          import base64, gzip, pathlib, subprocess
          patch = gzip.decompress(base64.b64decode(''))
          pathlib.Path('/tmp/v1619.patch').write_bytes(patch)
          sw = gzip.decompress(base64.b64decode(''))
          pathlib.Path('sw.js').write_bytes(sw)
          PY2
          git apply /tmp/v1619.patch
          cat > CHANGELOG_V16.19.md <<'EOF'
          # BrineSearch V16.19 — Direction System Cleanup

          - Added North, Northeast, East, Southeast, South, Southwest, West, and Northwest as structured travel-direction options.
          - Separated maneuver text, travel direction, road sign, distance, and notes.
          - Updated Add Pad and Edit Pad direction workflows.
          - Improved legacy direction parsing and fixed merged direction text.
          - Updated displayed version and service-worker cache to V16.19.
          EOF
      - name: Commit V16.19
        shell: bash
        run: |
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js CHANGELOG_V16.19.md
          git diff --cached --quiet && exit 0
          git commit -m "Release BrineSearch V16.19"
          git push
