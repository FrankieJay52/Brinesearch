name: Align issue 69 migration history

on:
  push:
    branches:
      - map/issue-69-migration-history-alignment
    paths:
      - .github/workflows/issue69-migration-history-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map/issue-69-migration-history-alignment
          fetch-depth: 0
      - name: Align repository migration versions to production history
        shell: bash
        run: |
          set -euo pipefail
          git mv supabase/migrations/20260811002000_issue69_route_geometry_draft_helpers.sql supabase/migrations/20260811031420_issue69_route_geometry_draft_helpers.sql
          git mv supabase/migrations/20260811023000_issue69_release_hardening.sql supabase/migrations/20260811031439_issue69_release_hardening.sql
          python <<'PY'
          from pathlib import Path
          replacements = {
              '20260811002000_issue69_route_geometry_draft_helpers.sql': '20260811031420_issue69_route_geometry_draft_helpers.sql',
              '20260811023000_issue69_release_hardening.sql': '20260811031439_issue69_release_hardening.sql',
          }
          for path in Path('v17/scripts').glob('*.mjs'):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
          PY
          git diff --check
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations v17/scripts
          git commit -m 'Align #69 migration history with production'
          git push origin HEAD:map/issue-69-migration-history-alignment
