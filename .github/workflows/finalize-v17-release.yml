name: Finalize BrineSearch V17 release

on:
  push:
    branches: [v17-refactor]
    paths:
      - '.github/workflows/finalize-v17-release.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v17-refactor
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mark the modular build as V17.0.0
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '17.0.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '17.0.0';
          if (lock.packages?.['']) lock.packages[''].version = '17.0.0';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');

          const viteConfig = `import { defineConfig } from 'vite';
          import { fileURLToPath, URL } from 'node:url';

          const releaseHtml = {
            name: 'brinesearch-v17-release-html',
            transformIndexHtml(html) {
              return html
                .replace(/BrineSearch V17 Preview — · Field Pad Directory/g, 'BrineSearch · Field Pad Directory')
                .replace(/<meta\\s+name=["']brinesearch-build["']\\s+content=["'][^"']*["']\\s*\\/?>(?=)/i, '<meta name="brinesearch-build" content="17.0.0">');
            }
          };

          export default defineConfig({
            root: fileURLToPath(new URL('.', import.meta.url)),
            publicDir: 'public',
            plugins: [releaseHtml],
            build: { outDir: '../dist-v17', emptyOutDir: true, target: 'es2020' },
            server: { host: true, port: 4173 }
          });
          `;
          fs.writeFileSync('v17/vite.config.js', viteConfig.replace(/^          /gm, ''));
          NODE

      - name: Install project dependencies
        run: npm ci

      - name: Verify and build production V17
        run: npm run build

      - name: Verify production title and build marker
        run: |
          grep -q '<title>BrineSearch · Field Pad Directory</title>' dist-v17/index.html
          grep -q 'name="brinesearch-build" content="17.0.0"' dist-v17/index.html

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npx vite preview --config v17/vite.config.js --host 127.0.0.1 --port 4173 > /tmp/v17-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v17-preview.log
          exit 1

      - name: Audit V17 on iPhone and desktop
        env:
          V17_PREVIEW_URL: http://127.0.0.1:4173
        run: node v17/scripts/browser-smoke.mjs

      - name: Commit production V17 release source
        run: |
          rm -f .github/workflows/finalize-v17-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize BrineSearch V17.0 modular release [skip ci]"
          git push origin v17-refactor

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/v17-preview.log || true
