name: Patch issue 70 deterministic context geometry

on:
  push:
    branches:
      - data/issue-70-oh-ambiguous-context
    paths:
      - .github/workflows/issue70-context-deterministic-geometry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/issue-70-oh-ambiguous-context
      - name: Make candidate geometry aggregation deterministic
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260811044500_issue70_oh_ambiguous_context_resolution.sql')
          text = path.read_text()
          old = 'extensions.st_unaryunion(extensions.st_collect(c.geom))'
          new = 'extensions.st_unaryunion(extensions.st_collect(c.geom order by c.objectid))'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 geometry aggregation sites, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260811044500_issue70_oh_ambiguous_context_resolution.sql
          git commit -m 'Make #70 context geometry digests deterministic'
          git push origin HEAD:data/issue-70-oh-ambiguous-context
