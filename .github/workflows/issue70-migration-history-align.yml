name: Align issue 70 migration history

on:
  push:
    branches:
      - data/issue-70-oh-road-coverage
    paths:
      - .github/workflows/issue70-migration-history-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/issue-70-oh-road-coverage
          fetch-depth: 0
      - name: Align repository migration versions with production
        shell: bash
        run: |
          set -euo pipefail
          git mv supabase/migrations/20260811034500_issue70_all_operator_oh_exact_road_coverage.sql supabase/migrations/20260811042124_issue70_all_operator_oh_exact_road_coverage.sql
          git mv supabase/migrations/20260811034520_issue70_release_assertions.sql supabase/migrations/20260811042137_issue70_release_assertions.sql
          git mv supabase/migrations/20260811042500_issue70_staging_fk_index.sql supabase/migrations/20260811042658_issue70_staging_fk_index.sql
          python <<'PY'
          from pathlib import Path
          replacements = {
              '20260811034500_issue70_all_operator_oh_exact_road_coverage.sql': '20260811042124_issue70_all_operator_oh_exact_road_coverage.sql',
              '20260811034520_issue70_release_assertions.sql': '20260811042137_issue70_release_assertions.sql',
              '20260811042500_issue70_staging_fk_index.sql': '20260811042658_issue70_staging_fk_index.sql',
          }
          for path in [Path('v17/scripts/audit-road-data-coverage-issue70.mjs')]:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git diff --check
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations v17/scripts/audit-road-data-coverage-issue70.mjs
          git commit -m 'Align #70 migration history with production'
          git push origin HEAD:data/issue-70-oh-road-coverage
