name: Package BrineSearch source for V17.3 audit

on:
  push:
    branches:
      - v17.3-full-product-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package source tree
        run: |
          zip -r BrineSearch-V17.3-audit-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist-v17/*' 'dist-pages/*' '*.DS_Store'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: BrineSearch-V17.3-audit-source
          path: BrineSearch-V17.3-audit-source.zip
          if-no-files-found: error
          retention-days: 7
