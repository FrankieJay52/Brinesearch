name: Extract V16.22 Function Bodies

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/function-map-v16-22.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract function bodies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8',errors='replace')
          names=['openPadEditor','persistPadEdit','padById','renderPad','router','openLivePadEditor','saveLivePadEdit','mapSupabasePad','setupPadRoadPicker']
          def extract(name):
            m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',text)
            if not m:return f'NOT FOUND: {name}'
            start=m.start(); i=m.end()-1; depth=0; quote=None; esc=False; template_depth=[]
            while i<len(text):
              c=text[i]
              if quote:
                if esc: esc=False
                elif c=='\\': esc=True
                elif quote=='`' and c=='$' and i+1<len(text) and text[i+1]=='{':
                  template_depth.append(depth); depth+=1; i+=1
                elif c==quote and (quote!='`' or not template_depth): quote=None
                elif c=='}' and quote=='`' and template_depth and depth==template_depth[-1]+1:
                  depth-=1; template_depth.pop()
              else:
                if c in ('"',"'",'`'): quote=c
                elif c=='{': depth+=1
                elif c=='}':
                  depth-=1
                  if depth==0:return text[start:i+1]
              i+=1
            return text[start:start+30000]
          out=[]
          for n in names:
            out.append('\n'+'='*100+'\n'+n+'\n'+'='*100+'\n'+extract(n))
          Path('V16.22_FUNCTIONS.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit function map
        shell: bash
        run: |
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add V16.22_FUNCTIONS.txt
          git diff --cached --quiet && exit 0
          git commit -m "Extract V16.22 scanner integration functions"
          git push
