name: Capture BrineSearch V17.3 visual audit

on:
  push:
    branches:
      - v17.3-full-product-audit

permissions:
  contents: read

concurrency:
  group: brinesearch-v17-3-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify and build BrineSearch
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/brinesearch-visual-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/brinesearch-visual-preview.log
          exit 1

      - name: Capture mobile and desktop screens
        run: node v17/scripts/visual-capture.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/brinesearch-visual-preview.log || true

      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: BrineSearch-V17.3-visual-audit
          path: visual-audit
          if-no-files-found: error
          retention-days: 7
