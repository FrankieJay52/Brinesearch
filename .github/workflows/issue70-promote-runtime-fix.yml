name: Promote issue 70 runtime fix into base migration

on:
  push:
    branches:
      - data/issue-70-oh-road-coverage
    paths:
      - .github/workflows/issue70-promote-runtime-fix.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/issue-70-oh-road-coverage
          fetch-depth: 0
      - name: Promote reviewed loader/apply definitions into base migration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          base_path = Path('supabase/migrations/20260811034500_issue70_all_operator_oh_exact_road_coverage.sql')
          fix_path = Path('supabase/migrations/20260811034510_issue70_all_operator_oh_exact_road_coverage_runtime_fix.sql')
          base = base_path.read_text()
          fix = fix_path.read_text()

          loader = 'create or replace function public.brinesearch_load_oh_road_geometry_issue70'
          apply = 'create or replace function public.brinesearch_apply_oh_road_matches_issue70'
          coverage = 'create or replace function public.brinesearch_oh_road_coverage_issue70'
          loader_revoke = 'revoke all on function public.brinesearch_load_oh_road_geometry_issue70(integer)'

          base_loader_start = base.index(loader)
          base_apply_start = base.index(apply, base_loader_start)
          base_loader_revoke = base.index(loader_revoke, base_loader_start)
          # Preserve the base file's existing revoke/grant between loader and apply.
          base_loader_function = base[base_loader_start:base_loader_revoke]

          fix_loader_start = fix.index(loader)
          fix_apply_start = fix.index(apply, fix_loader_start)
          fix_loader_function = fix[fix_loader_start:fix_apply_start]

          base = base[:base_loader_start] + fix_loader_function + base[base_loader_revoke:]

          # Re-find apply after loader replacement.
          base_apply_start = base.index(apply)
          base_apply_revoke = base.index('revoke all on function public.brinesearch_apply_oh_road_matches_issue70()', base_apply_start)
          fix_apply_start = fix.index(apply)
          fix_apply_end = fix.index(loader_revoke, fix_apply_start)
          fix_apply_function = fix[fix_apply_start:fix_apply_end]
          base = base[:base_apply_start] + fix_apply_function + base[base_apply_revoke:]

          if 'pg_catalog.position(' in base:
              raise SystemExit('base migration still contains invalid pg_catalog.position')
          if 'min(r.id)' in base:
              raise SystemExit('base migration still contains unsupported min(uuid)')
          if 'pg_catalog.strpos' not in base:
              raise SystemExit('base migration did not receive strpos correction')
          if 'where r.source_record_id=v_identity' not in base:
              raise SystemExit('base migration did not receive exact identity selection correction')
          if coverage not in base:
              raise SystemExit('coverage function was lost during source promotion')

          base_path.write_text(base)
          PY
          git diff --check
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260811034500_issue70_all_operator_oh_exact_road_coverage.sql
          git commit -m 'Promote #70 runtime fixes into base migration'
          git push origin HEAD:data/issue-70-oh-road-coverage
