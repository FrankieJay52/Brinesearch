name: Finalize BrineSearch V16.22

on:
  push:
    paths:
      - .github/workflows/release-v16-22-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brinesearch-v16-22-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate validated front sign scanner
        shell: bash
        run: |
          set -euo pipefail
          test -f front-sign-scanner.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          html = re.sub(
              r'\s*<script[^>]*(?:id=["\']brinesearch-front-sign-scanner["\']|src=["\'][^"\']*front-sign-scanner\.js[^"\']*["\'])[^>]*>\s*</script>\s*',
              '\n',
              html,
              flags=re.I,
          )
          closing_body = html.lower().rfind('</body>')
          if closing_body < 0:
              raise SystemExit('index.html has no closing body tag')
          scanner_tag = '  <script id="brinesearch-front-sign-scanner" src="./front-sign-scanner.js" defer></script>\n'
          html = html[:closing_body] + scanner_tag + html[closing_body:]

          replacements = (
              ('V 16.21', 'V 16.22'),
              ('V16.21', 'V16.22'),
              ('v16.21', 'v16.22'),
              ('16.21', '16.22'),
          )
          for old, new in replacements:
              html = html.replace(old, new)

          if html.count('front-sign-scanner.js') != 1:
              raise SystemExit('front-sign-scanner.js must appear exactly once in index.html')
          index_path.write_text(html, encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(
              r"const CACHE_VERSION = ['\"]brinesearch-v\d+-\d+['\"];",
              "const CACHE_VERSION = 'brinesearch-v16-22';",
              sw,
              count=1,
          )
          sw = sw.replace("'./front-sign-scanner.js', ", '').replace("'./front-sign-scanner.js',", '')
          marker = "const APP_SHELL = ['./', './index.html',"
          if marker not in sw:
              raise SystemExit('APP_SHELL marker was not found in sw.js')
          sw = sw.replace(marker, "const APP_SHELL = ['./', './index.html', './front-sign-scanner.js',", 1)
          if sw.count('./front-sign-scanner.js') != 1:
              raise SystemExit('front-sign-scanner.js must appear exactly once in the service-worker app shell')
          sw_path.write_text(sw, encoding='utf-8')

          changelog = Path('CHANGELOG_V16.22.md')
          if not changelog.exists():
              changelog.write_text('''# BrineSearch V16.22 — Scan Front Sign

- Added Scan Front Sign to the regular Pad Page.
- Added Scan Front Sign inside both Edit Pad systems.
- Uses the rear camera or an existing photo and reads sign text in the browser.
- Recognizes pad, operator, address, county, township, coordinates, wells, API numbers, property numbers, gate codes, phone numbers, emergency information, safety warnings, and access notes.
- Requires review before applying any recognized information.
- Merges wells, APIs, and property numbers instead of erasing existing entries.
- Supports saved local sign cards, iPhone layouts, dark/light modes, and offline app-shell caching.
''', encoding='utf-8')
          PY

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          node --check front-sign-scanner.js
          node --check sw.js
          test "$(grep -o 'front-sign-scanner.js' index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'id="brinesearch-front-sign-scanner"' index.html
          grep -q 'src="./front-sign-scanner.js"' index.html
          grep -q "const VERSION = '16.22'" front-sign-scanner.js
          grep -q 'capture="environment"' front-sign-scanner.js
          grep -q 'padEditorForm' front-sign-scanner.js
          grep -q 'liveEditorForm' front-sign-scanner.js
          grep -q "brinesearch-v16-22" sw.js
          test "$(grep -o './front-sign-scanner.js' sw.js | wc -l | tr -d ' ')" = "1"

      - name: Commit production V16.22
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-v16-22-final.yml
          rm -f .github/workflows/release-v16-22.yml
          rm -f .github/workflows/release-v16-22-direct.yml
          rm -f .github/workflows/source-map-v16-22.yml
          rm -f .github/workflows/edit-map-v16-22.yml
          rm -f .github/workflows/function-map-v16-22.yml
          rm -f V16.22_SOURCE_MAP.txt V16.22_EDIT_MAP.txt V16.22_FUNCTIONS.txt
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release BrineSearch V16.22"
          git push origin HEAD:main
