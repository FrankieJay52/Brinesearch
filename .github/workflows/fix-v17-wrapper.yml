name: Fix and validate V17 startup wrapper

on:
  push:
    branches: [v17-refactor]
    paths:
      - '.github/workflows/fix-v17-wrapper.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v17-refactor
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct wrapper and rebuild source hash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const manifestPath = path.join('v17', 'src', 'parts', 'part-order.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.wrapperEnd = '});';
          const parts = manifest.parts.map(name => fs.readFileSync(path.join('v17', 'src', 'parts', name), 'utf8'));
          const assembled = `${manifest.wrapperStart}\n${parts.join('\n')}\n${manifest.wrapperEnd}\n`;
          manifest.assembledSha256 = crypto.createHash('sha256').update(assembled).digest('hex');
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`Corrected wrapper and recalculated ${manifest.assembledSha256}`);
          NODE

      - name: Install project dependencies
        run: npm ci

      - name: Verify and build V17
        run: npm run build

      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npx vite preview --config v17/vite.config.js --host 127.0.0.1 --port 4173 > /tmp/v17-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v17-preview.log
          exit 1

      - name: Audit iPhone and desktop layouts
        env:
          V17_PREVIEW_URL: http://127.0.0.1:4173
        run: node v17/scripts/browser-smoke.mjs

      - name: Commit validated wrapper repair
        run: |
          rm -f .github/workflows/fix-v17-wrapper.yml
          rm -f v17/AUDIT_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix V17 startup wrapper after modular split [skip ci]"
          git push origin v17-refactor

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/v17-preview.log || true
