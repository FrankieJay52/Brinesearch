name: Deploy BrineSearch V17.3.1 to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brinesearch-github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify and build BrineSearch V17.3.1
        run: npm run build

      - name: Prepare repository-path assets for GitHub Pages
        run: node v17/scripts/prepare-pages.mjs

      - name: Verify deployable files
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/404.html
          test -f dist-pages/.nojekyll
          test -f dist-pages/app/front-sign-structured.js
          test -f dist-pages/pages-deployment.json
          grep -q "/${{ github.event.repository.name }}/app/brinesearch-app.js" dist-pages/index.html
          grep -q "/${{ github.event.repository.name }}/styles/app.css" dist-pages/index.html
          grep -q '"version": "17.3.1"' dist-pages/pages-deployment.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    name: Deploy live site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy BrineSearch
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result on the commit
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FALLBACK_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATE="success"
            DESCRIPTION="BrineSearch V17.3.1 is live"
            TARGET_URL="${PAGE_URL:-$FALLBACK_PAGE_URL}"
          else
            STATE="failure"
            DESCRIPTION="GitHub Pages deployment needs attention"
            TARGET_URL="$RUN_URL"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="BrineSearch / GitHub Pages" \
            -f description="$DESCRIPTION" \
            -f target_url="$TARGET_URL"
