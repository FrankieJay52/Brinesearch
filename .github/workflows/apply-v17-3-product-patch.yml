name: Apply BrineSearch V17.3 product patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'v17.3-full-product-audit' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: v17.3-full-product-audit
          fetch-depth: 0

      - name: Check whether V17.3 is already applied
        id: state
        run: |
          if grep -q '"version": "17.3.0"' package.json; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "V17.3 source is already present."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify reviewed V17.3 patch
        if: steps.state.outputs.apply == 'true'
        env:
          SUPABASE_URL: https://wvxzqtoiwhrgovzddtvz.supabase.co
          SUPABASE_KEY: sb_publishable_5_sw9B-bcSdWgDzp4Z3pnQ_b-tutvtd
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/v17_3_patch_transfer?select=part,payload&order=part.asc" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Accept: application/json" > /tmp/v17-3-parts.json
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          rows = json.loads(Path('/tmp/v17-3-parts.json').read_text())
          if [row['part'] for row in rows] != list(range(7)):
              raise SystemExit('V17.3 patch transfer is incomplete')
          encoded = ''.join(row['payload'] for row in rows)
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = '35b862d112c8c9d39f093c40d7286c37fcf663874f524d19954c23625dc052e7'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'V17.3 patch checksum mismatch: {actual}')
          Path('/tmp/v17.3.patch').write_bytes(patch)
          print(f'Verified V17.3 patch: {len(patch):,} bytes')
          PY
          git apply --check /tmp/v17.3.patch
          git apply /tmp/v17.3.patch

      - name: Keep workflow files unchanged for GitHub App permissions
        if: steps.state.outputs.apply == 'true'
        run: git restore --source=HEAD --worktree --staged .github/workflows

      - name: Verify assembled V17.3 source
        if: steps.state.outputs.apply == 'true'
        run: |
          node v17/scripts/verify.mjs
          node v17/scripts/verify-road-manager.mjs
          node v17/scripts/verify-v17-3.mjs

      - name: Commit reviewed V17.3 product build
        if: steps.state.outputs.apply == 'true'
        run: |
          git config user.name "BrineSearch Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build BrineSearch V17.3 full product polish"
          git push origin HEAD:v17.3-full-product-audit
