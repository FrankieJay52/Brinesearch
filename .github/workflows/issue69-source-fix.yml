name: Issue 69 migration source repair

on:
  push:
    branches:
      - map/issue-69-structured-route-foundation
    paths:
      - .github/workflows/issue69-source-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map/issue-69-structured-route-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair exact reviewed migration source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'supabase/migrations/20260811002000_issue69_route_geometry_draft_helpers.sql';
          let text = fs.readFileSync(file, 'utf8');
          const fixes = [
            ["p.proconfig @> array['search_path=']::text[]", "p.proconfig @> array['search_path=\"\"']::text[]"],
            ["end||v_step->>'road_name';", "end||(v_step->>'road_name');"]
          ];
          for (const [before, after] of fixes) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one occurrence of ${before}, found ${count}`);
            text = text.replace(before, after);
          }
          fs.writeFileSync(file, text);
          NODE
          git diff --check
          git diff --exit-code --quiet && { echo 'No repair required'; exit 0; }
          git config user.name 'BrineSearch Release Coordinator'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/migrations/20260811002000_issue69_route_geometry_draft_helpers.sql
          git commit -m 'Fix #69 migration source rehearsal defects'
          git push origin HEAD:map/issue-69-structured-route-foundation
