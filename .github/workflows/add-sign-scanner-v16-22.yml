name: Build and audit BrineSearch V16.22

on:
  push:
    paths:
      - .github/workflows/add-sign-scanner-v16-22.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Integrate, test, audit, and release V16.22
        shell: bash
        run: bash scripts/release-v16-22.sh
