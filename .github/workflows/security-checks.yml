name: BrineSearch security checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "security/**"
      - "release/**"

permissions:
  contents: read

jobs:
  build-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check assembled JavaScript syntax
        run: node --check v17/public/app/brinesearch-app.js
      - name: Check security files are wired into the build
        run: |
          grep -q '00-security-boot.js' v17/src/parts/part-order.json
          grep -q '01a-public-submission-security.js' v17/src/parts/part-order.json
          grep -q '11a-security-public-pad-detail.js' v17/src/parts/part-order.json
          grep -q '14a-field-profile-security.js' v17/src/parts/part-order.json
          grep -q '33-security-hardening.css' v17/src/styles/style-order.json
          grep -q 'Content-Security-Policy-Report-Only' netlify.toml
          test "$(find supabase/migration_sources/20260808050000_urgent_security_hardening -name '*.sql' | wc -l)" -eq 8
          grep -R -q 'road_manager_route_prep_summary' supabase/migration_sources/20260808050000_urgent_security_hardening
          grep -R -q 'pad_verification_public_status' supabase/migration_sources/20260808050000_urgent_security_hardening
          grep -R -q 'submit_pad_server' supabase/migration_sources/20260808050000_urgent_security_hardening
      - name: Check Ruby-Opal and public projection migrations
        run: |
          projection=supabase/migrations/20260808064425_harden_public_pad_projection.sql
          ruby=supabase/migrations/20260808064502_publish_ruby_opal_verified_route.sql
          test -f "$projection"
          test -f "$ruby"
          test ! -e supabase/migrations/20260808070000_harden_public_pad_projection.sql
          test ! -e supabase/migrations/20260808070500_publish_ruby_opal_verified_route.sql
          grep -q 'security_invoker=true' "$projection"
          grep -q 'sync_public_pad_detail_projection' "$projection"
          grep -q 'Anonymous direct pads-table access returned' "$projection"
          grep -q 'Ruby-Opal pad entrance is on the left' "$ruby"
          grep -q "legacy_id in ('ascent--able','ascent--durr')" "$ruby"
          grep -q 'ascent_clear<>250' "$ruby"
          grep -q 'distance-only direction card remains' "$ruby"
      - name: Check V17.3.5 public mileage boundary
        run: |
          migration=supabase/migrations/20260808202932_publish_public_pad_anchor_mileage.sql
          publisher=supabase/maintenance/publish_anchor_mileage_snapshot_20260808.sql
          test -f "$migration"
          test -f "$publisher"
          grep -q 'enable row level security' "$migration"
          grep -q 'using (not is_stale)' "$migration"
          grep -q 'mark_public_pad_anchor_mileage_stale' "$migration"
          grep -q 'Internal review evidence and unavailable/conflicted candidates are excluded' "$migration"
          grep -q "final_candidate_status in" "$publisher"
          grep -q 'Expected 743 current public anchor rows' "$publisher"
          grep -q 'Misleading zero-mile display remains' "$publisher"
          grep -q 'public_pad_anchor_mileage' v17/src/parts/11c-anchor-mileage-card.js
          grep -q 'VERIFIED ROAD REFERENCE' v17/src/parts/11c-anchor-mileage-card.js
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
