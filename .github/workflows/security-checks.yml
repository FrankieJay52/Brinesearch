name: BrineSearch security checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - "security/**"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: brinesearch-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check security-sensitive runtime source boundaries
        run: |
          node --check scripts/assemble-production.mjs
          node --check scripts/retire-legacy-service-worker.js
          node --check v18/scripts/verify-built-runtime.mjs
          grep -q 'Content-Security-Policy-Report-Only' netlify.toml
          test "$(find supabase/migration_sources/20260808050000_urgent_security_hardening -name '*.sql' | wc -l)" -eq 8
          grep -R -q 'road_manager_route_prep_summary' supabase/migration_sources/20260808050000_urgent_security_hardening
          grep -R -q 'pad_verification_public_status' supabase/migration_sources/20260808050000_urgent_security_hardening
          grep -R -q 'submit_pad_server' supabase/migration_sources/20260808050000_urgent_security_hardening
      - name: Check Ruby-Opal and public projection migrations
        run: |
          projection=supabase/migrations/20260808064425_harden_public_pad_projection.sql
          ruby=supabase/migrations/20260808064502_publish_ruby_opal_verified_route.sql
          test -f "$projection"
          test -f "$ruby"
          test ! -e supabase/migrations/20260808070000_harden_public_pad_projection.sql
          test ! -e supabase/migrations/20260808070500_publish_ruby_opal_verified_route.sql
          grep -q 'security_invoker=true' "$projection"
          grep -q 'sync_public_pad_detail_projection' "$projection"
          grep -q 'Anonymous direct pads-table access returned' "$projection"
          grep -q 'Ruby-Opal pad entrance is on the left' "$ruby"
          grep -q "legacy_id in ('ascent--able','ascent--durr')" "$ruby"
          grep -q 'ascent_clear<>250' "$ruby"
          grep -q 'distance-only direction card remains' "$ruby"
      - name: Check retained driver route intelligence migrations
        run: |
          route_ref=supabase/migrations/20260808212630_driver_route_reference_v1736.sql
          kind_guard=supabase/migrations/20260808212856_driver_route_reference_kind_guard_v1736.sql
          test -f "$route_ref"
          test -f "$kind_guard"
          test ! -e supabase/migrations/20260808211000_driver_route_reference_v1736.sql
          test ! -e supabase/migrations/20260808212500_driver_route_reference_kind_guard_v1736.sql
          grep -q 'final_distance_unavailable_source_omission' "$route_ref"
          grep -q 'Expected 317 useful unavailable anchors' "$route_ref"
          grep -q 'Expected 678 numeric driver distances' "$route_ref"
          grep -q 'Private/non-driving details are visible after V17.3.6 refresh' "$route_ref"
          grep -q 'driver_route_reference_kind_v1736' "$kind_guard"
          grep -q "return 'route_reference'" "$kind_guard"
          grep -q "return 'county_road'" "$kind_guard"
          grep -q "return 'township_road'" "$kind_guard"
          grep -q 'Expected 4 mixed-family route references' "$kind_guard"
          grep -q 'Numeric driver-distance count changed during road-type normalization' "$kind_guard"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
