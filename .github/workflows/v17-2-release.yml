name: Build BrineSearch V17.3

on:
  push:
    branches:
      - main
      - v17.3-full-product-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brinesearch-v17-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-route-families:
    name: Apply grouped Road Manager route-family patch
    if: github.event_name == 'pull_request' && github.head_ref == 'road-manager-route-prep-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Route Prep branch
        uses: actions/checkout@v4
        with:
          ref: road-manager-route-prep-ui
          fetch-depth: 0

      - name: Patch and commit when helper exists
        shell: bash
        run: |
          if [ ! -f .github/scripts/patch-road-manager-route-families.py ]; then
            echo "Route-family patch already applied."
            exit 0
          fi
          python3 .github/scripts/patch-road-manager-route-families.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes were produced."
            exit 0
          fi
          git commit -m "Group duplicate route numbers and show ambiguous references safely"
          git push origin HEAD:road-manager-route-prep-ui

  build-test-package:
    name: Build, browser-test, and package V17.3
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify and build V17.3
        run: npm run build

      - name: Install browser-test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start V17.3 preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/brinesearch-v17-preview.log 2>&1 &
          echo $! > /tmp/brinesearch-v17-preview.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brinesearch-v17-preview.log
          exit 1

      - name: Audit iPhone and desktop builds
        env:
          V17_PREVIEW_URL: http://127.0.0.1:4173
          V17_VISUAL_AUDIT_DIR: visual-audit/smoke
        run: node v17/scripts/browser-smoke.mjs

      - name: Capture all core V17.3 screens
        run: node v17/scripts/visual-capture.mjs

      - name: Show preview log after failure
        if: failure()
        run: cat /tmp/brinesearch-v17-preview.log || true

      - name: Package V17.3
        run: |
          test -f dist-v17/index.html
          cd dist-v17
          zip -r ../BrineSearch-V17.3.zip .
          cd ..
          sha256sum BrineSearch-V17.3.zip > BrineSearch-V17.3.sha256

      - name: Upload V17.3 release file
        uses: actions/upload-artifact@v4
        with:
          name: BrineSearch-V17.3
          path: |
            BrineSearch-V17.3.zip
            BrineSearch-V17.3.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload V17.3 visual audit
        uses: actions/upload-artifact@v4
        with:
          name: BrineSearch-V17.3-visual-audit
          path: visual-audit
          if-no-files-found: error
          retention-days: 14
